name: 'Stale Discussions (audit only)'

on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List inactive discussions without changing them
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data: issues} = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', sort: 'updated', direction: 'desc', per_page: 100
            });
            const now = Date.now();
            const candidates = issues.filter(issue => {
              const minDays = 60;
              return (now - Date.parse(issue.updated_at)) > minDays * 86400000;
            });
            const lines = [
              '## Stale discussion candidates',
              '',
              'Read-only sample: the 100 most recently updated open issues and PRs.',
              'No labels, locks, issues, or PRs were modified.',
              '',
              ...candidates.map(issue =>
                '- #' + issue.number + ' ' + (issue.pull_request ? '(PR) ' : '(issue) ') +
                issue.title.replace(/[\r\n]/g, ' ') + ' — last updated ' + issue.updated_at
              )
            ];
            if (candidates.length === 0) lines.push('No candidates in the sampled window.');
            await core.summary.addRaw(lines.join('\n') + '\n').write();
